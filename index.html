<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spudy Intelligence | Future of AI in Africa</title>
  <meta name="description" content="The most powerful AI platform in Africa. Create videos, images, music, code & apps instantly." />
  <meta name="theme-color" content="#030712" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" />
  <link rel="preconnect" href="https://unpkg.com" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Syne', 'sans-serif'],
            sans: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: { 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7' },
            dark: { 900: '#030712', 800: '#0f172a', 700: '#1e293b' },
          },
        }
      }
    }
  </script>

  <!-- AOS Animation Library -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════════
       CSS VARIABLES & BASE
    ═══════════════════════════════════════════════════════ */
    :root {
      --brand: #0ea5e9;
      --brand-light: #38bdf8;
      --brand-dark: #0284c7;
      --glow: rgba(14, 165, 233, 0.35);
      --bg-primary: #030712;
      --bg-secondary: #0f172a;
      --bg-card: rgba(17, 24, 39, 0.75);
      --text-primary: #ffffff;
      --text-secondary: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(17, 24, 39, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    :root.light-mode {
      --bg-primary: #f8fafc;
      --bg-secondary: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.85);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --border: rgba(0, 0, 0, 0.08);
      --glass-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(0, 0, 0, 0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background 0.5s ease, color 0.5s ease;
    }

    /* ═══════════════════════════════════════════════════════
       SCROLLBAR
    ═══════════════════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: #1e3a4a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--brand); }

    /* ═══════════════════════════════════════════════════════
       SCROLL PROGRESS BAR
    ═══════════════════════════════════════════════════════ */
    #scroll-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--brand-light), #8b5cf6, #ec4899);
      z-index: 9999;
      width: 0%;
      transition: width 0.1s linear;
      box-shadow: 0 0 10px var(--glow);
    }

    /* ═══════════════════════════════════════════════════════
       CUSTOM LOADING SCREEN
    ═══════════════════════════════════════════════════════ */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg-primary);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-ring {
      width: 80px;
      height: 80px;
      border: 3px solid transparent;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      position: relative;
    }

    .loader-ring::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-bottom-color: #8b5cf6;
      animation: spin 1.5s linear infinite reverse;
    }

    .loader-ring::after {
      content: '';
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-left-color: #ec4899;
      animation: spin 2s linear infinite;
    }

    .loader-text {
      margin-top: 2rem;
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      background: linear-gradient(90deg, var(--brand-light), #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse2 2s ease-in-out infinite;
    }

    .loader-subtext {
      margin-top: 0.5rem;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    /* ═══════════════════════════════════════════════════════
       GLASSMORPHISM
    ═══════════════════════════════════════════════════════ */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-card:hover {
      background: rgba(31, 41, 55, 0.95);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 0 40px -10px rgba(56, 189, 248, 0.35);
      transform: translateY(-8px);
    }

    .light-mode .glass-card:hover {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 40px -10px rgba(14, 165, 233, 0.25);
    }

    /* ═══════════════════════════════════════════════════════
       GRADIENT TEXT
    ═══════════════════════════════════════════════════════ */
    .text-grad {
      background: linear-gradient(90deg, #38bdf8, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ═══════════════════════════════════════════════════════
       AMBIENT BLOBS
    ═══════════════════════════════════════════════════════ */
    .blob {
      position: fixed;
      width: 640px;
      height: 640px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(139, 92, 246, 0.08) 100%);
      filter: blur(90px);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: blobFloat 18s infinite ease-in-out;
    }

    .blob-2 {
      animation-delay: -5s;
      animation-duration: 22s;
    }

    .blob-3 {
      animation-delay: -10s;
      animation-duration: 20s;
      width: 480px;
      height: 480px;
    }

    /* ═══════════════════════════════════════════════════════
       THREE.JS CANVAS
    ═══════════════════════════════════════════════════════ */
    #neural-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.5;
      pointer-events: none;
    }

    /* ═══════════════════════════════════════════════════════
       NAVIGATION
    ═══════════════════════════════════════════════════════ */
    #navbar {
      transition: all 0.3s ease;
    }

    #navbar.scrolled {
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      padding-top: 0.75rem;
      padding-bottom: 0.75rem;
    }

    .light-mode #navbar.scrolled {
      background: rgba(248, 250, 252, 0.9);
      border-bottom: 1px solid rgba(0, 0, 0, 0.07);
    }

    .nav-link {
      position: relative;
      transition: color 0.3s ease;
    }

    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--brand-light), #8b5cf6);
      transition: width 0.3s ease;
      border-radius: 1px;
    }

    .nav-link:hover::after,
    .nav-link.active::after {
      width: 100%;
    }

    /* ═══════════════════════════════════════════════════════
       MOBILE DRAWER
    ═══════════════════════════════════════════════════════ */
    #drawer {
      transform: translateX(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #drawer.open {
      transform: translateX(0);
    }

    #drawer-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #drawer-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    /* ═══════════════════════════════════════════════════════
       RIPPLE BUTTON EFFECT
    ═══════════════════════════════════════════════════════ */
    .ripple-btn {
      position: relative;
      overflow: hidden;
    }

    .ripple-btn .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      transform: scale(0);
      animation: rippleAnim 0.6s ease-out;
      pointer-events: none;
    }

    /* ═══════════════════════════════════════════════════════
       INTERACTIVE CURSOR
    ═══════════════════════════════════════════════════════ */
    .custom-cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border: 2px solid var(--brand);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transition: transform 0.15s ease, background 0.15s ease, width 0.2s ease, height 0.2s ease;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }

    .custom-cursor.hover {
      transform: translate(-50%, -50%) scale(2);
      background: rgba(14, 165, 233, 0.15);
    }

    .cursor-dot {
      position: fixed;
      width: 6px;
      height: 6px;
      background: var(--brand);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
    }

    /* ═══════════════════════════════════════════════════════
       BACK TO TOP BUTTON
    ═══════════════════════════════════════════════════════ */
    #back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), #8b5cf6);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
    }

    #back-to-top.visible {
      opacity: 1;
      transform: translateY(0);
    }

    #back-to-top:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(14, 165, 233, 0.5);
    }

    /* ═══════════════════════════════════════════════════════
       FLOATING ACTION BUTTON
    ═══════════════════════════════════════════════════════ */
    .fab-container {
      position: fixed;
      bottom: 2rem;
      left: 2rem;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .fab-main {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--brand), #8b5cf6);
      color: white;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      box-shadow: 0 4px 20px rgba(14, 165, 233, 0.4);
      transition: all 0.3s ease;
      animation: fabPulse 3s ease-in-out infinite;
    }

    .fab-main:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 30px rgba(14, 165, 233, 0.5);
    }

    .fab-menu {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .fab-menu.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .fab-item {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.875rem;
    }

    .fab-item:hover {
      background: var(--brand);
      color: white;
      transform: scale(1.1);
    }

    /* ═══════════════════════════════════════════════════════
       DARK MODE TOGGLE
    ═══════════════════════════════════════════════════════ */
    .theme-toggle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .theme-toggle:hover {
      background: var(--brand);
      color: white;
      transform: rotate(180deg);
    }

    /* ═══════════════════════════════════════════════════════
       SKELETON LOADING
    ═══════════════════════════════════════════════════════ */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: skeletonShimmer 1.5s infinite;
      border-radius: 0.5rem;
    }

    .light-mode .skeleton {
      background: linear-gradient(90deg, rgba(0,0,0,0.05) 25%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.05) 75%);
      background-size: 200% 100%;
    }

    /* ═══════════════════════════════════════════════════════
       PRICING CARDS
    ═══════════════════════════════════════════════════════ */
    .plan-popular {
      box-shadow: 0 0 60px -10px rgba(56, 189, 248, 0.28);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .badge-starter { background: rgba(107, 114, 128, 0.2); color: #9ca3af; }
    .badge-creator { background: rgba(14, 165, 233, 0.2); color: #38bdf8; }
    .badge-pro { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }
    .badge-enterprise { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }

    /* ═══════════════════════════════════════════════════════
       FAQ
    ═══════════════════════════════════════════════════════ */
    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, padding 0.3s ease;
    }

    .faq-answer.open {
      max-height: 400px;
      padding-top: 1rem;
    }

    .faq-chevron {
      transition: transform 0.3s ease;
    }

    .faq-chevron.open {
      transform: rotate(180deg);
    }

    /* ═══════════════════════════════════════════════════════
       TOOL FILTER BUTTONS
    ═══════════════════════════════════════════════════════ */
    .filter-btn {
      transition: all 0.2s ease;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      border: 1px solid var(--glass-border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 0.875rem;
    }

    .filter-btn:hover {
      border-color: var(--brand-light);
      color: var(--text-primary);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, var(--brand), #8b5cf6);
      color: white;
      border-color: transparent;
      box-shadow: 0 4px 15px rgba(14, 165, 233, 0.3);
    }

    /* ═══════════════════════════════════════════════════════
       TOOL CARDS
    ═══════════════════════════════════════════════════════ */
    .tool-card {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      opacity: 1;
      transform: scale(1);
    }

    .tool-card.hidden {
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      position: absolute;
    }

    .tool-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px -10px rgba(14, 165, 233, 0.2);
    }

    /* ═══════════════════════════════════════════════════════
       NOTIFICATION
    ═══════════════════════════════════════════════════════ */
    .notif {
      animation: slideInRight 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    /* ═══════════════════════════════════════════════════════
       MODAL
    ═══════════════════════════════════════════════════════ */
    .modal-overlay {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal-content {
      transform: scale(0.9) translateY(20px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.open .modal-content {
      transform: scale(1) translateY(0);
    }

    /* ═══════════════════════════════════════════════════════
       COUNTER ANIMATION
    ═══════════════════════════════════════════════════════ */
    .counter-value {
      font-variant-numeric: tabular-nums;
    }

    /* ═══════════════════════════════════════════════════════
       INPUT STYLES
    ═══════════════════════════════════════════════════════ */
    .inp {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 1rem;
      padding: 0.9rem 1.4rem;
      color: var(--text-primary);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .inp::placeholder { color: #6b7280; }

    .inp:focus {
      border-color: #38bdf8;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .light-mode .inp {
      background: rgba(0, 0, 0, 0.03);
      border-color: rgba(0, 0, 0, 0.1);
      color: var(--text-primary);
    }

    .light-mode .inp:focus {
      background: rgba(0, 0, 0, 0.05);
    }

    /* ═══════════════════════════════════════════════════════
       PROMPT BAR
    ═══════════════════════════════════════════════════════ */
    #prompt-bar:focus-within {
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 30px -5px rgba(56, 189, 248, 0.15);
    }

    /* ═══════════════════════════════════════════════════════
       TESTIMONIAL CAROUSEL
    ═══════════════════════════════════════════════════════ */
    .testimonial-slide {
      transition: all 0.5s ease;
    }

    /* ═══════════════════════════════════════════════════════
       PARTICLE CANVAS
    ═══════════════════════════════════════════════════════ */
    #particle-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.3;
    }

    /* ═══════════════════════════════════════════════════════
       GRADIENT MESH BACKGROUND
    ═══════════════════════════════════════════════════════ */
    .gradient-mesh {
      position: fixed;
