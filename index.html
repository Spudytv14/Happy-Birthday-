<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spudy Intelligence | Future of AI in Africa</title>
    <meta name="description" content="The most powerful AI platform in Africa. Create videos, images, music, code & apps instantly." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
        /* ===== ROOT ===== */
        :root {
            --bg-primary: #050508;
            --bg-secondary: #0a0a12;
            --bg-card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f0f5;
            --text-secondary: #8a8a9a;
            --accent-gold: #FFD700;
            --accent-teal: #00D9C0;
            --accent-purple: #7B2CBF;
            --accent-warm: #FF6B6B;
            --glass: rgba(255, 255, 255, 0.04);
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--accent-gold), var(--accent-teal));
            border-radius: 3px;
        }

        /* ===== NOISE OVERLAY ===== */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* ===== NAVBAR ===== */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 1.2rem 4%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all .4s ease;
        }
        nav.scrolled {
            background: rgba(5, 5, 8, .85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: .8rem 4%;
        }
        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -.5px;
            cursor: pointer;
        }
        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
        }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: .9rem;
            font-weight: 500;
            transition: color .3s ease;
            position: relative;
            cursor: pointer;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-teal));
            transition: width .3s ease;
        }
        .nav-links a:hover {
            color: var(--text-primary);
        }
        .nav-links a:hover::after {
            width: 100%;
        }
        .nav-cta {
            padding: .6rem 1.5rem;
            background: linear-gradient(135deg, var(--accent-gold), #FFA500);
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: .85rem;
            cursor: pointer;
            transition: transform .3s ease, box-shadow .3s ease;
        }
        .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, .3);
        }
        .mobile-menu-btn {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            z-index: 1001;
        }
        .mobile-menu-btn span {
            width: 24px;
            height: 2px;
            background: var(--text-primary);
            transition: all .3s ease;
        }
        .mobile-menu {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 8, .98);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            transform: translateX(100%);
            transition: transform .4s ease;
        }
        .mobile-menu.open {
            transform: translateX(0);
        }
        .mobile-menu a {
            color: var(--text-primary);
            text-decoration: none;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
        }
        .mobile-menu .nav-cta {
            display: block;
            margin-top: 1rem;
        }

        /* ===== HERO ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 8rem 4% 4rem;
            overflow: hidden;
        }
        .hero-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }
        .hero-bg .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .4;
            animation: float 20s infinite ease-in-out;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-purple), transparent);
            top: -10%;
            left: -10%;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-teal), transparent);
            bottom: -10%;
            right: -10%;
            animation-delay: -5s;
        }
        .orb-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-gold), transparent);
            top: 40%;
            left: 60%;
            animation-delay: -10s;
            opacity: .2;
        }
        @keyframes float {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(50px, -50px) scale(1.1);
            }
            50% {
                transform: translate(-30px, 30px) scale(.95);
            }
            75% {
                transform: translate(20px, 40px) scale(1.05);
            }
        }
        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 900px;
            text-align: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .5rem 1.2rem;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: .85rem;
            color: var(--accent-teal);
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }
        .badge .pulse {
            width: 8px;
            height: 8px;
            background: var(--accent-teal);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .5;
                transform: scale(1.2);
            }
        }
        .hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            letter-spacing: -2px;
        }
        .gradient-text {
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--text-primary) 50%, var(--accent-teal) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
        }
        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .hero p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 2.5rem;
            line-height: 1.7;
        }
        .prompt-box {
            max-width: 700px;
            margin: 0 auto 2rem;
            position: relative;
        }
        .prompt-input-wrapper {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem;
            backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: border-color .3s ease, box-shadow .3s ease;
        }
        .prompt-input-wrapper:focus-within {
            border-color: rgba(255, 215, 0, .3);
            box-shadow: 0 0 40px rgba(255, 215, 0, .1);
        }
        .prompt-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .prompt-input-wrapper input::placeholder {
            color: var(--text-secondary);
        }
        .prompt-btn {
            padding: .7rem 1.5rem;
            background: linear-gradient(135deg, var(--accent-gold), #FFA500);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all .3s ease;
            white-space: nowrap;
        }
        .prompt-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 215, 0, .4);
        }
        .suggested-prompts {
            display: flex;
            flex-wrap: wrap;
            gap: .6rem;
            justify-content: center;
            margin-top: 1rem;
        }
        .suggested-prompts span {
            padding: .4rem 1rem;
            background: rgba(255, 255, 255, .03);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: .8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all .3s ease;
        }
        .suggested-prompts span:hover {
            background: rgba(255, 215, 0, .1);
            border-color: var(--accent-gold);
            color: var(--accent-gold);
            transform: translateY(-2px);
        }
        .hero-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 4rem;
            flex-wrap: wrap;
        }
        .btn-primary {
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, var(--accent-gold), #FFA500);
            color: #000;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all .3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 215, 0, .35);
        }
        .btn-secondary {
            padding: 1rem 2.5rem;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all .3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, .05);
            border-color: rgba(255, 255, 255, .2);
            transform: translateY(-3px);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .stat-item {
            text-align: center;
            padding: 1.5rem;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
            transition: transform .3s ease;
        }
        .stat-item:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 215, 0, .2);
        }
        .stat-number {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-label {
            font-size: .8rem;
            color: var(--text-secondary);
            margin-top: .3rem;
        }

        /* ===== SECTIONS ===== */
        section {
            padding: 6rem 4%;
            position: relative;
        }
        .section-header {
            text-align: center;
            max-width: 600px;
            margin: 0 auto 4rem;
        }
        .section-tag {
            display: inline-block;
            padding: .4rem 1rem;
            background: rgba(0, 217, 192, .1);
            border: 1px solid rgba(0, 217, 192, .2);
            border-radius: 50px;
            color: var(--accent-teal);
            font-size: .8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        .section-desc {
            color: var(--text-secondary);
            font-size: 1.05rem;
        }

        /* ===== SERVICES ===== */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .service-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            transition: all .4s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-teal));
            transform: scaleX(0);
            transition: transform .4s ease;
        }
        .service-card:hover::before {
            transform: scaleX(1);
        }
        .service-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 215, 0, .2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
        }
        .service-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, rgba(255, 215, 0, .1), rgba(0, 217, 192, .1));
            border: 1px solid rgba(255, 215, 0, .15);
        }
        .service-card h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            margin-bottom: .8rem;
        }
        .service-card p {
            color: var(--text-secondary);
            font-size: .95rem;
            line-height: 1.6;
        }

        /* ===== TOOLS ===== */
        .tools-section {
            background: var(--bg-secondary);
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .tool-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.8rem;
            transition: all .3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .tool-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255, 215, 0, .1), transparent 50%);
            opacity: 0;
            transition: opacity .3s ease;
            pointer-events: none;
        }
        .tool-card:hover::after {
            opacity: 1;
        }
        .tool-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(255, 215, 0, .25);
        }
        .tool-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 1rem;
            background: rgba(123, 44, 191, .15);
            border: 1px solid rgba(123, 44, 191, .2);
        }
        .tool-card h4 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            margin-bottom: .4rem;
        }
        .tool-card p {
            font-size: .8rem;
            color: var(--text-secondary);
        }

        /* ===== PRICING ===== */
  

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            max-width: 1000px;
            margin: 0 auto;
            align-items: start;
        }
        .pricing-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            transition: all .4s ease;
            position: relative;
        }
        .pricing-card.featured {
            background: linear-gradient(180deg, rgba(123, 44, 191, .15), rgba(5, 5, 8, .9));
            border-color: rgba(123, 44, 191, .4);
            transform: scale(1.05);
            box-shadow: 0 20px 60px rgba(123, 44, 191, .2);
        }
        .pricing-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 215, 0, .3);
        }
        .pricing-card.featured:hover {
            transform: scale(1.05) translateY(-8px);
        }
        .pricing-badge {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            padding: .4rem 1.2rem;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-teal));
            border-radius: 50px;
            font-size: .75rem;
            font-weight: 700;
            color: #fff;
        }
        .pricing-card h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            margin-bottom: .5rem;
        }
        .pricing-card .price {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            margin: 1.5rem 0;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .pricing-card .price span {
            font-size: 1rem;
            color: var(--text-secondary);
            -webkit-text-fill-color: var(--text-secondary);
        }
        .pricing-features {
            list-style: none;
            margin: 2rem 0;
        }
        .pricing-features li {
            padding: .6rem 0;
            color: var(--text-secondary);
            font-size: .9rem;
            display: flex;
            align-items: center;
            gap: .6rem;
        }
        .pricing-features li::before {
            content: '✓';
            color: var(--accent-teal);
            font-weight: 700;
        }
        .pricing-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: all .3s ease;
            font-size: .95rem;
        }
        .pricing-btn:hover {
            background: rgba(255, 255, 255, .05);
            border-color: rgba(255, 255, 255, .3);
        }
        .pricing-card.featured .pricing-btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-teal));
            border: none;
            color: #fff;
        }
        .pricing-card.featured .pricing-btn:hover {
            box-shadow: 0 10px 30px rgba(123, 44, 191, .4);
        }

        /* ===== REVIEWS ===== */
        .reviews-section {
            background: var(--bg-secondary);
            overflow: hidden;
        }
        .reviews-track {
            display: flex;
            gap: 1.5rem;
            animation: scroll 40s linear infinite;
            width: max-content;
        }
        .reviews-track:hover {
            animation-play-state: paused;
        }
        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
        .review-card {
            width: 380px;
            flex-shrink: 0;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem;
            backdrop-filter: blur(10px);
        }
        .review-stars {
            color: var(--accent-gold);
            font-size: 1.1rem;
            margin-bottom: 1rem;
            letter-spacing: 2px;
        }
        .review-text {
            color: var(--text-secondary);
            font-size: .95rem;
            line-height: 1.7;
            margin-bottom: 1.5rem;
        }
        .reviewer {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .reviewer-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-teal));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            font-size: .9rem;
        }
        .reviewer-info h5 {
            font-size: .95rem;
            margin-bottom: .2rem;
        }
        .reviewer-info span {
            font-size: .8rem;
            color: var(--text-secondary);
        }

        /* ===== ABOUT ===== */
        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            max-width: 1200px;
            margin: 0 auto;
            align-items: center;
        }
        .about-visual {
            position: relative;
            height: 400px;
            border-radius: 24px;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(123, 44, 191, .2), rgba(0, 217, 192, .1));
            border: 1px solid var(--border);
        }
        .about-visual::before {
            content: '';
            position: absolute;
            inset: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            opacity: .5;
        }
        .about-visual-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
        }
        .about-stat {
            text-align: center;
        }
        .about-stat-number {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .about-stat-label {
            font-size: .85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .about-text h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }
        .about-text p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.8;
        }

        /* ===== CTA ===== */
        .cta-section {
            text-align: center;
            padding: 8rem 4%;
            position: relative;
            overflow: hidden;
        }
        .cta-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, rgba(123, 44, 191, .15), transparent 70%);
        }
        .cta-section h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2rem, 4vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }
        .cta-section p {
            color: var(--text-secondary);
            max-width: 500px;
            margin: 0 auto 2.5rem;
            position: relative;
            z-index: 1;
            font-size: 1.1rem;
        }

        /* ===== FOOTER ===== */
        footer {
            border-top: 1px solid var(--border);
            padding: 4rem 4% 2rem;
            background: var(--bg-secondary);
        }
        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 3rem;
            max-width: 1200px;
            margin: 0 auto 3rem;
        }
        .footer-brand .logo {
            margin-bottom: 1rem;
            display: inline-block;
        }
        .footer-brand p {
            color: var(--text-secondary);
            font-size: .9rem;
            line-height: 1.7;
            max-width: 300px;
        }
        .footer-col h4 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        .footer-col ul {
            list-style: none;
        }
        .footer-col li {
            margin-bottom: .8rem;
        }
        .footer-col a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: .9rem;
            transition: color .3s ease;
            cursor: pointer;
        }
        .footer-col a:hover {
            color: var(--accent-teal);
        }
        .footer-bottom {
            border-top: 1px solid var(--border);
            padding-top: 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: .85rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* ===== REVEAL ===== */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all .8s cubic-bezier(.16, 1, .3, 1);
        }
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-delay-1 {
            transition-delay: .1s;
        }
        .reveal-delay-2 {
            transition-delay: .2s;
        }
        .reveal-delay-3 {
            transition-delay: .3s;
        }
        .reveal-delay-4 {
            transition-delay: .4s;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 8, .9);
            backdrop-filter: blur(10px);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity .4s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            overflow-y: auto;
            transform: scale(.9) translateY(20px);
            transition: transform .4s cubic-bezier(.16, 1, .3, 1);
            position: relative;
        }
        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }
        .modal-close {
            position: sticky;
            top: 1.5rem;
            float: right;
            margin: 1.5rem 1.5rem 0 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all .3s ease;
            z-index: 10;
            flex-shrink: 0;
        }
        .modal-close:hover {
            background: rgba(255, 107, 107, .2);
            border-color: var(--accent-warm);
            color: var(--accent-warm);
        }
        .modal-content {
            padding: 1.5rem 3rem 3rem;
            clear: both;
        }
        .modal-header {
            margin-bottom: 2rem;
        }
        .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            margin-bottom: .5rem;
        }
        .modal-header p {
            color: var(--text-secondary);
        }

        /* ===== CHATBOT ===== */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .chat-message {
            max-width: 80%;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            font-size: .95rem;
            line-height: 1.6;
            animation: messageIn .3s ease;
        }
        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .chat-message.bot {
            align-self: flex-start;
            background: rgba(0, 217, 192, .1);
            border: 1px solid rgba(0, 217, 192, .2);
            color: var(--text-primary);
        }
        .chat-message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, rgba(255, 215, 0, .15), rgba(255, 165, 0, .1));
            border: 1px solid rgba(255, 215, 0, .2);
            color: var(--text-primary);
        }
        .chat-input-area {
            display: flex;
            gap: .8rem;
            padding: 1rem;
            border-top: 1px solid var(--border);
        }
        .chat-input-area input {
            flex: 1;
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: .8rem 1rem;
            color: var(--text-primary);
            font-size: .95rem;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .chat-input-area input::placeholder {
            color: var(--text-secondary);
        }
        .chat-send-btn {
            padding: .8rem 1.5rem;
            background: linear-gradient(135deg, var(--accent-gold), #FFA500);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
            transition: all .3s ease;
        }
        .chat-send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(255, 215, 0, .3);
        }
